name: Build and test case study
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python src/build.py
      - run: python -m unittest discover -s tests -v
      - run: python src/render.py
      - run: node --check engine.js
      - run: node --check app.js
      - name: Commit generated data and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.js data/opportunities.csv data/results.json
          git diff --cached --quiet || (git commit -m "Build reproducible interactive case" && git push)

